name: Build macOS Release

on: [push]

jobs:
  # JOBB 1: macOS (Din gamla mall, uppdaterad för PATH)
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install Fyne CLI
        run: go install fyne.io/fyne/v2/cmd/fyne@latest

      - name: Build macOS App
        run: |
          $(go env GOPATH)/bin/fyne package -os darwin

      - name: Pack to Zip
        run: |
          zip -r pfsms_mac.zip *.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pfsms-macOS
          path: pfsms_mac.zip
